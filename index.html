<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Aurora — unified music player</title>
  <meta name="theme-color" content="#ff375f" />
  <meta name="description" content="Aurora: a Spotify and SoundCloud player with queue, library and search in one installable app." />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="glass" id="side">
      <a class="brand" href="#/home"><i>♫</i>Aurora</a>
      <div class="navlabel">Menu</div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidefoot" id="sidefoot"></div>
    </aside>
    <main id="main">
      <div id="banner"></div>
      <div id="view"></div>
      <section id="page-sources" class="offscreen" aria-label="Open a link"></section>
    </main>
  </div>

  <footer class="playerbar glass empty" id="bar" aria-label="Player"></footer>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Aurora needs JavaScript to run.</p></noscript>
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.innerHTML =
          '<div style="max-width:560px;margin:12vh auto;padding:24px;font-family:-apple-system,Segoe UI,sans-serif;line-height:1.6">' +
          '<h1>Open Aurora through a web server</h1>' +
          '<p>Browsers block the app’s modules and Spotify sign-in on <code>file://</code> pages. From this folder run:</p>' +
          '<pre style="background:#0001;padding:14px;border-radius:12px">python -m http.server 8080 --bind 127.0.0.1</pre>' +
          '<p>then visit <b>http://127.0.0.1:8080/</b></p></div>';
      });
    }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
